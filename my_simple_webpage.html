<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-simple-webpage</title>
    <!-- Tailwind CSS for modern responsive utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 lg:p-8 min-h-screen">

    <main class="w-full max-w-xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 transition-all duration-300 hover:shadow-2xl">
        <!-- Header Banner Accent -->
        <div class="h-3 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500"></div>

        <div class="p-6 sm:p-8 space-y-6">
            <!-- Site Tag/Title -->
            <header class="border-b border-slate-100 pb-6">
                <span class="inline-block px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-semibold tracking-wide uppercase mb-3">
                    # my-simple-webpage
                </span>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight">
                    Welcome to my webpage.
                </h1>
            </header>

            <!-- Main Content Area -->
            <div class="space-y-8 text-slate-700">
                
                <!-- Favourite Birds Section -->
                <section class="bg-slate-50/60 rounded-xl p-5 border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2 mb-3">
                        <i class="fa-solid font-bold fa-feather text-teal-600"></i>
                        <span>My favourite birds:</span>
                    </h2>
                    <ul class="space-y-2 pl-2">
                        <li class="flex items-center gap-3 text-slate-700 font-medium">
                            <span class="w-2 h-2 rounded-full bg-teal-500"></span>
                            shoebills
                        </li>
                        <li class="flex items-center gap-3 text-slate-700 font-medium">
                            <span class="w-2 h-2 rounded-full bg-teal-500"></span>
                            cockatiels
                        </li>
                        <li class="flex items-center gap-3 text-slate-700 font-medium">
                            <span class="w-2 h-2 rounded-full bg-teal-500"></span>
                            java sparrows
                        </li>
                    </ul>
                </section>

                <!-- Favourite Foods Section -->
                <section class="bg-slate-50/60 rounded-xl p-5 border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-utensils text-emerald-600"></i>
                        <span>My favourite foods (in order):</span>
                    </h2>
                    <ol class="space-y-2.5 pl-1">
                        <li class="flex items-start gap-3 text-slate-700 font-medium">
                            <span class="flex items-center justify-center min-w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold mt-0.5">1</span>
                            <span>steak tartare <em class="italic text-slate-500 font-normal">with potato chips</em></span>
                        </li>
                        <li class="flex items-start gap-3 text-slate-700 font-medium">
                            <span class="flex items-center justify-center min-w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold mt-0.5">2</span>
                            <span>salmon sashimi</span>
                        </li>
                        <li class="flex items-start gap-3 text-slate-700 font-medium">
                            <span class="flex items-center justify-center min-w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold mt-0.5">3</span>
                            <span>chocolate ice cream</span>
                        </li>
                    </ol>
                </section>

            </div>

            <!-- Footer -->
            <footer class="pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
                Crafted with care • Simple HTML Page
            </footer>
        </div>
    </main>

</body>
</html>
